<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wheatland Weather Radar</title>

<!--
  Wheatland Weather Radar — v3
  ----------------------------------------------------------
  v3 changes (fixing the "METAR popup shows the entire bbox JSON dump"
  report from v2's METAR rework):
    - METAR fetching is now a background refresh into a lookup table
      (latestStations), keyed by ICAO. Nothing is drawn or shown until
      a marker is tapped.
    - Airport markers are back to a small, hand-maintained list
      (AIRPORTS array) instead of one marker per station in the bbox
      response — same spirit as the original two-airport version, but
      now the METAR text comes from one shared bbox fetch instead of a
      separate fetch per tap.
    - Markers are smaller (10px) per request.
    - METAR fetch now goes through a personal Cloudflare Worker
      (metar-proxy.vince320.workers.dev) instead of a public CORS
      proxy. The worker itself just fetches the bbox JSON from
      aviationweather.gov and returns it with CORS headers attached —
      all I/O happens inside its fetch(request) handler, not at
      top-level (Workers disallow top-level async/timers/random).

  Open this file directly in Safari (Files app / iCloud Drive / AirDrop),
  then "Add to Home Screen" for a full-screen, no-address-bar app feel.
  Also deployed at https://n2aie.github.io/WXR-map/ via GitHub Pages.

  WHAT'S WORKING:
    - Leaflet.js map (pinch-zoom, drag-pan, tap markers — all built in)
    - OpenStreetMap base layer
    - Live RainViewer radar overlay, auto-refreshed every 10 minutes
    - Tap Beale AFB (KBAB) or Lincoln Regional (KLHM) markers for METAR,
      pulled from a shared background fetch, not a per-tap request

  ADDING MORE AIRPORTS: add another {icao, lat, lon, name} object to the
  AIRPORTS array below. As long as the ICAO falls inside the worker's
  bbox query, its METAR will be available in latestStations once fetched.
-->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #111; overflow: hidden; }
  #map { position: absolute; top: 0; left: 0; width: 100%; }

  .metar-popup { font-family: -apple-system, sans-serif; font-size: 13px; line-height: 1.4; max-width: 260px; }
  .metar-popup .icao { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .metar-popup .raw { font-family: ui-monospace, monospace; word-break: break-word; }
  .metar-popup .status { color: #888; font-style: italic; }

  .refresh-badge {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(20,20,20,0.85); color: #fff; font-family: -apple-system, sans-serif;
    font-size: 12px; padding: 6px 10px; border-radius: 8px; pointer-events: none;
  }

  #errorBanner {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2000;
    background: #b00020; color: #fff; font-family: -apple-system, sans-serif;
    font-size: 13px; padding: 10px; display: none; white-space: pre-wrap;
  }
</style>
</head>
<body>

<div id="errorBanner"></div>
<div id="map"></div>
<div class="refresh-badge" id="refreshBadge">Loading radar…</div>

<script>
  // On-page error visibility — there's no JS console on an iPad without a
  // Mac connected via cable for Safari's Web Inspector, so any failure
  // gets shown directly on screen instead of silently vanishing.
  function showError(msg) {
    const banner = document.getElementById('errorBanner');
    banner.textContent = String(msg);
    banner.style.display = 'block';
  }
  window.addEventListener('error', e => showError('JS error: ' + e.message));

  // Force the map container's actual pixel height via JS rather than
  // relying on CSS height:100%, which can misbehave on mobile Safari in
  // some contexts (local files, home-screen-added pages). Re-run on
  // resize/orientation change too.
  function sizeMapContainer() {
    document.getElementById('map').style.height = window.innerHeight + 'px';
  }
  sizeMapContainer();
  window.addEventListener('resize', sizeMapContainer);
  window.addEventListener('orientationchange', sizeMapContainer);

  if (typeof L === 'undefined') {
    showError('Leaflet failed to load (no internet connection when this page opened, or the CDN is unreachable). The map library itself never initialized.');
  }
</script>

<script>
  // ---- Config ----
  const START_LAT = 39.0154, START_LON = -121.4244; // Wheatland, CA
  const START_ZOOM = 8;

  const RADAR_REFRESH_MS = 10 * 60 * 1000; // 10 minutes
  const METAR_REFRESH_MS = 10 * 60 * 1000; // same cadence as radar
  const METAR_PROXY_URL = "https://metar-proxy.vince320.workers.dev/";

  const AIRPORTS = [
    { icao: "KBAB", name: "Beale AFB",        lat: 39.13611, lon: -121.43639 },
    { icao: "KLHM", name: "Lincoln Regional",  lat: 38.90917, lon: -121.35139 },
  ];

  try {

  // ---- Map setup ----
  const map = L.map('map', {
    zoomControl: true,
  }).setView([START_LAT, START_LON], START_ZOOM);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  let radarLayer = null;

  // ---- Radar overlay (RainViewer) ----
  async function refreshRadarLayer() {
    const badge = document.getElementById('refreshBadge');
    try {
      badge.textContent = "Fetching radar…";
      const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
      const data = await res.json();
      const frames = data.radar.past;
      const latest = frames[frames.length - 1];
      const tileUrl = 'https://tilecache.rainviewer.com' + latest.path + '/256/{z}/{x}/{y}/2/1_1.png';

      if (radarLayer) map.removeLayer(radarLayer);
      radarLayer = L.tileLayer(tileUrl, { opacity: 0.65, zIndex: 6, maxNativeZoom: 10 }).addTo(map);

      const t = new Date(latest.time * 1000);
      badge.textContent = "Radar: " + t.toLocaleTimeString();
    } catch (err) {
      badge.textContent = "Radar fetch failed";
      console.error("Radar refresh error:", err);
    }
  }

  refreshRadarLayer();
  setInterval(refreshRadarLayer, RADAR_REFRESH_MS);

  // ---- METAR background refresh (lookup table, not drawn until tapped) ----
  let latestStations = {}; // icaoId -> station object

  async function refreshMetars() {
    try {
      const res = await fetch(METAR_PROXY_URL);
      const stations = await res.json();

      latestStations = {};
      stations.forEach(st => { latestStations[st.icaoId] = st; });
    } catch (err) {
      console.error("METAR refresh error:", err);
    }
  }

  refreshMetars();
  setInterval(refreshMetars, METAR_REFRESH_MS);

  // ---- Airport markers + tap-to-show-METAR ----
  function metarIcon() {
    return L.divIcon({
      className: '',
      html: '<div style="width:10px;height:10px;border-radius:50%;background:#ff8fa3;border:1.5px solid #000;box-shadow:0 0 2px rgba(0,0,0,0.6);"></div>',
      iconSize: [10, 10],
      iconAnchor: [5, 5],
    });
  }

  AIRPORTS.forEach(ap => {
    const marker = L.marker([ap.lat, ap.lon], { icon: metarIcon() }).addTo(map);
    const popup = L.popup();

    marker.on('click', () => {
      const st = latestStations[ap.icao];
      const content = st
        ? `<div class="metar-popup"><div class="icao">${ap.icao} — ${ap.name}</div><div class="raw">${st.rawOb}</div></div>`
        : `<div class="metar-popup"><div class="icao">${ap.icao} — ${ap.name}</div><div class="status">No current METAR</div></div>`;
      popup.setLatLng([ap.lat, ap.lon]).setContent(content).openOn(map);
    });
  });

  } catch (initErr) {
    showError('Map initialization failed: ' + initErr.message);
  }
</script>

</body>
</html>
